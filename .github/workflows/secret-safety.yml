name: Secret safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select commit range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$BASE_SHA"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="refs/remotes/origin/$DEFAULT_BRANCH"
          fi
          if git cat-file -e "${base}^{commit}" 2>/dev/null && [ "$(git rev-parse "$base")" != "$(git rev-parse HEAD)" ]; then
            log_opts="$base..HEAD"
          else
            log_opts="--all"
          fi
          echo "log_opts=$log_opts" >> "$GITHUB_OUTPUT"
      - name: Reject local agent state and database backups in current files and introduced commits
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          introduced = subprocess.check_output([
              'git', 'log', '--format=', '--name-only', '--diff-filter=ACR',
              '-z', os.environ['LOG_OPTS']]).decode().split('\0')
          paths = sorted(set(paths + [p.lstrip('\n') for p in introduced]))
          blocked = [p for p in paths if p and (
              p.endswith(('.claude/settings.local.json', '.claude/history.jsonl',
                          '.aider.chat.history.md', '.aider.input.history'))
              or any(part in p.split('/') for part in ('.specstory',))
              or '/.claude/projects/' in '/' + p
              or '/.claude/transcripts/' in '/' + p
              or re.search(r'\.(?:sqlite3?|db)\.bak', p))]
          for path in blocked:
              print('Remove private agent state/database backups from introduced commits: ' + path)
          sys.exit(bool(blocked))
          PY
      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan introduced commits, including agent files and documentation
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml \
            --no-banner --redact=100 --max-decode-depth=2 --log-opts="$LOG_OPTS"
